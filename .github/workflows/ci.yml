name: CI

on:
  # main is checked by deploy.yml, which runs this workflow before publishing.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The sample PDFs are not in the repository, so the tests that need them skip themselves here.
      # Everything else runs on the committed, anonymised fixtures.
      - name: Unit and property tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests (Chromium, Firefox, iPhone SE, Android)
        run: npm run e2e

      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
